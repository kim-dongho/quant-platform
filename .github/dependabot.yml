# Dependabot — 의존성 자동 업데이트 PR.
#
# 솔로 프로젝트 부하를 줄이기 위해:
#  - 월 1회 (interval: monthly)
#  - minor / patch 만 자동 (major 는 수동 결정)
#  - 같은 ecosystem 은 한 PR 로 그룹핑
#  - PR 갯수 제한
version: 2
updates:
  # npm (pnpm) — root + apps/web 통합
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Go modules — apps/server
  - package-ecosystem: "gomod"
    directory: "/apps/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Python pip — apps/engine
  - package-ecosystem: "pip"
    directory: "/apps/engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # GitHub Actions — workflows 의 actions/* 버전
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Docker base 이미지 — apps/engine, apps/server
  - package-ecosystem: "docker"
    directory: "/apps/engine"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/apps/server"
    schedule:
      interval: "monthly"
