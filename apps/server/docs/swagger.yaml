basePath: /api
definitions:
  internal_controller.StockItem:
    properties:
      symbol:
        example: NVDA
        type: string
    type: object
  internal_controller.StockSearchItem:
    properties:
      name:
        example: Rocket Lab Corporation
        type: string
      symbol:
        example: RKLB
        type: string
    type: object
  quant-server_internal_model.BacktestRequest:
    type: object
  quant-server_internal_model.IntradayCandle:
    description: 실시간 트레이딩 차트(Lightweight Charts)를 위한 1분봉 OHLCV 데이터
    properties:
      close:
        example: 15.4
        type: number
      high:
        example: 15.8
        type: number
      low:
        example: 14.9
        type: number
      open:
        example: 15.25
        type: number
      symbol:
        example: RKLB
        type: string
      time:
        example: 1700000000
        type: integer
      volume:
        example: 12500
        type: number
    type: object
  quant-server_internal_model.MarketData:
    description: 개별 일자의 시가, 고가, 저가, 종가 및 거래량 정보
    properties:
      bb_l:
        example: 139.8
        type: number
      bb_m:
        example: 150
        type: number
      bb_u:
        example: 160.2
        type: number
      close:
        example: 153.4
        type: number
      high:
        example: 155.8
        type: number
      low:
        example: 149.1
        type: number
      macd:
        example: 1.25
        type: number
      macd_h:
        example: 0.45
        type: number
      open:
        example: 150.25
        type: number
      rsi:
        description: 보조지표 필드
        example: 55.42
        type: number
      time:
        example: "2026-02-01"
        type: string
      volume:
        example: 1200500
        type: number
    type: object
  quant-server_internal_model.PortfolioRule:
    properties:
      config:
        items:
          type: integer
        type: array
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  quant-server_internal_model.PortfolioRuleRequest:
    properties:
      config:
        items:
          type: integer
        type: array
      name:
        example: 오버솔드 리버설
        type: string
    type: object
  quant-server_internal_model.StockHistoryResponse:
    description: 주식의 기본 정보와 과거 시세 데이터를 포함합니다.
    properties:
      company_name:
        example: NVIDIA Corporation
        type: string
        x-order: "2"
      data:
        items:
          $ref: '#/definitions/quant-server_internal_model.MarketData'
        type: array
        x-order: "3"
      symbol:
        example: NVDA
        type: string
        x-order: "1"
    type: object
host: localhost:8080
info:
  contact: {}
  description: Go + Python 퀀트 플랫폼 API 서버입니다.
  title: Quant Trading API
  version: "1.0"
paths:
  /backtest:
    post:
      consumes:
      - application/json
      description: 파라미터를 Python 엔진으로 전달하여 백테스트 결과(수익률 곡선 등)를 받아옵니다.
      parameters:
      - description: 백테스트 설정 (Ticker 및 전략 파라미터)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quant-server_internal_model.BacktestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 수익률 데이터 및 날짜 배열
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Engine connection failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 퀀트 백테스트 실행
      tags:
      - backtest
  /paper/balance:
    get:
      description: KIS Open API로 잔고와 보유종목을 조회합니다. 모의/실전 분기는 엔진의 KIS_MODE 환경변수가 결정합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 모의투자 계좌 잔고 조회 (KIS API 엔진 프록시)
      tags:
      - paper
  /paper/orders:
    get:
      parameters:
      - description: YYYYMMDD — 생략 시 오늘
        in: query
        name: start_date
        type: string
      - description: YYYYMMDD — 생략 시 오늘
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 모의투자 주문/체결 내역 (KIS API 엔진 프록시)
      tags:
      - paper
    post:
      consumes:
      - application/json
      description: '{ symbol, qty, side: buy|sell, order_type: market|limit, price?
        }'
      parameters:
      - description: 주문 payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 모의투자 주문 (KIS API 엔진 프록시)
      tags:
      - paper
  /paper/quote/{symbol}:
    get:
      parameters:
      - description: 6자리 숫자 코드 또는 .KS/.KQ suffix 포함
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 국내주식 현재가 (KIS API 엔진 프록시)
      tags:
      - paper
  /portfolio/backtest:
    post:
      consumes:
      - application/json
      parameters:
      - description: Backtest request (universe, clauses, max_positions, start_date,
          end_date)
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 포트폴리오 백테스트 실행 (엔진 프록시)
      tags:
      - portfolio
  /portfolio/rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/quant-server_internal_model.PortfolioRule'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 포트폴리오 룰셋 목록 조회
      tags:
      - portfolio
    post:
      consumes:
      - application/json
      parameters:
      - description: 룰셋 payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quant-server_internal_model.PortfolioRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quant-server_internal_model.PortfolioRule'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 포트폴리오 룰셋 생성
      tags:
      - portfolio
  /portfolio/rules/{id}:
    delete:
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 포트폴리오 룰셋 삭제
      tags:
      - portfolio
    put:
      consumes:
      - application/json
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      - description: 룰셋 payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quant-server_internal_model.PortfolioRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quant-server_internal_model.PortfolioRule'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 포트폴리오 룰셋 수정
      tags:
      - portfolio
  /portfolio/screen:
    post:
      consumes:
      - application/json
      parameters:
      - description: Screen request (universe, clauses, max_positions, as_of)
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 포트폴리오 스크리닝 실행 (엔진 프록시)
      tags:
      - portfolio
  /stocks/{symbol}/history:
    get:
      consumes:
      - application/json
      description: 특정 심볼의 회사명과 과거 시세 데이터를 조회합니다. (없으면 자동 수집)
      parameters:
      - description: Stock Symbol (e.g., NVDA)
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quant-server_internal_model.StockHistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 주식 히스토리 조회
      tags:
      - stocks
  /stocks/{symbol}/intraday:
    get:
      consumes:
      - application/json
      description: 특정 심볼의 1분봉(Intraday) 시세 데이터를 조회합니다. (없으면 자동 수집)
      parameters:
      - description: Stock Symbol (e.g., NVDA)
        in: path
        name: symbol
        required: true
        type: string
      - description: '가져올 데이터 갯수 (기본값: 1000)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/quant-server_internal_model.IntradayCandle'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 1분봉 시세 조회
      tags:
      - stocks
  /stocks/list:
    get:
      description: DB에 저장된 중복 없는 종목 심볼 목록을 조회합니다. 검색창의 자동완성(Autocomplete) 기능에 사용됩니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_controller.StockItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 종목 리스트 조회 (자동완성용)
      tags:
      - stocks
  /stocks/search:
    get:
      description: 'symbol 또는 회사명(영문·한국어)에 q가 포함된 종목을 랭킹 순으로 반환합니다. 순위: 완전일치 > symbol
        접두사 > name 접두사 > symbol 부분일치 > name 부분일치.'
      parameters:
      - description: 검색어 (symbol 또는 회사명 일부)
        in: query
        name: q
        required: true
        type: string
      - description: 최대 반환 개수 (기본 20, 최대 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_controller.StockSearchItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 종목 자동완성 검색
      tags:
      - stocks
swagger: "2.0"
